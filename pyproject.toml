[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "causal-fpe-control"
version = "0.1.0"
description = "m-conservative PC and reproducible causal discovery experiments"
readme = "README.md"
requires-python = ">=3.12,!=3.14.1"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Erik Jahn"}]
dependencies = [
    "numpy==2.5.1", "scipy==1.17.1", "networkx==3.6.1",
    "scikit-learn==1.8.0", "causal-learn==0.1.4.5",
    "matplotlib==3.10.8", "psutil==7.2.2",
]

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
include = ["mcpc*", "experiments*"]
